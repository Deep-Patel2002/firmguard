<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
  <title id="title">FirmGuard parser architecture</title>
  <desc id="desc">Untrusted FGMF v1 bytes pass through bounded framing and semantic validation. Separate C11 and Rust parsers return a borrowed view or an error. Differential tests compare both implementations. Authenticity, payload verification, device identity, rollback control, and update installation remain caller responsibilities.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#10192d"/><stop offset="1" stop-color="#182a45"/></linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#22d3ee"/><stop offset="1" stop-color="#38bdf8"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#020617" flood-opacity=".28"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#60a5fa"/></marker>
    <style>
      .title{font:700 30px Arial,sans-serif;fill:#f8fafc}.sub{font:15px Arial,sans-serif;fill:#a9bad2}
      .head{font:700 16px Arial,sans-serif;fill:#f8fafc}.body{font:14px Arial,sans-serif;fill:#c6d3e5}
      .small{font:12px Arial,sans-serif;fill:#9fb0c9}.mono{font:700 13px 'SFMono-Regular',Consolas,monospace;fill:#b8eaf4}
      .box{fill:#1f304c;stroke:#3b5374;stroke-width:1.2}.inner{fill:#17263f;stroke:#375371;stroke-width:1}
      .line{stroke:#60a5fa;stroke-width:2;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="690" rx="28" fill="url(#bg)"/>
  <circle cx="1100" cy="55" r="155" fill="#2563eb" opacity=".08"/>
  <circle cx="25" cy="625" r="190" fill="#06b6d4" opacity=".06"/>
  <text x="52" y="64" class="title">FirmGuard · parser architecture</text>
  <text x="52" y="92" class="sub">Bounded metadata validation before caller-controlled update decisions</text>

  <g filter="url(#shadow)">
    <rect x="52" y="145" width="210" height="118" rx="18" class="box"/>
    <rect x="292" y="145" width="240" height="118" rx="18" class="box"/>
    <rect x="563" y="135" width="300" height="326" rx="22" fill="#14243b" stroke="#315776" stroke-width="1.5"/>
    <rect x="894" y="145" width="254" height="142" rx="18" class="box"/>
    <rect x="894" y="316" width="254" height="145" rx="18" class="box"/>
    <rect x="52" y="310" width="480" height="151" rx="18" fill="#14243b" stroke="#405778" stroke-width="1.2"/>
    <rect x="52" y="505" width="1096" height="127" rx="20" fill="#17263f" stroke="#3b5374" stroke-width="1.2"/>
  </g>

  <path d="M262 204H286" class="line"/><path d="M532 204H556" class="line"/>
  <path d="M863 214H887" class="line"/><path d="M863 380H887" class="line"/>
  <path d="M1000 293V307" class="line"/>
  <path d="M410 270V301" class="line"/>

  <text x="76" y="180" class="small">INPUT</text>
  <text x="76" y="207" class="head">Untrusted bytes</text>
  <text x="76" y="233" class="mono">FGMF v1 · little-endian</text>

  <text x="316" y="180" class="small">STAGE 1</text>
  <text x="316" y="207" class="head">Bounded framing</text>
  <text x="316" y="232" class="body">≤ 65,536 bytes</text>
  <text x="316" y="251" class="body">TLV lengths · flags · budgets</text>

  <text x="588" y="170" class="small">STAGE 2 · INDEPENDENT PARSERS</text>
  <rect x="589" y="188" width="248" height="82" rx="14" class="inner"/>
  <rect x="589" y="282" width="248" height="82" rx="14" class="inner"/>
  <text x="610" y="216" class="head">C11 parser</text>
  <text x="610" y="242" class="body">No heap allocation · borrowed view</text>
  <text x="610" y="310" class="head">Safe Rust parser</text>
  <text x="610" y="336" class="body">Borrowed view · canonical comparison</text>
  <text x="590" y="401" class="small">Same wire format, independently implemented</text>
  <text x="590" y="423" class="small">Malformed input returns status; C output stays zeroed</text>

  <text x="918" y="180" class="small">ACCEPT</text>
  <text x="918" y="208" class="head">Validated metadata</text>
  <text x="918" y="235" class="body">Required fields · paths</text>
  <text x="918" y="257" class="body">Ordered, bounded ranges</text>

  <text x="918" y="351" class="small">REJECT</text>
  <text x="918" y="379" class="head">Status code</text>
  <text x="918" y="406" class="body">Truncation · overflow</text>
  <text x="918" y="428" class="body">Duplicates · critical unknowns</text>

  <text x="76" y="347" class="small">STAGE 3</text>
  <text x="76" y="376" class="head">Semantic validation</text>
  <text x="76" y="404" class="body">Unique paths · required records · overflow-safe bounds</text>
  <text x="76" y="429" class="body">No overlapping ranges · optional unknown fields skipped</text>

  <text x="78" y="543" class="small">OUTSIDE THIS PARSER · CALLER / UPDATE COORDINATOR</text>
  <rect x="78" y="560" width="206" height="48" rx="12" class="inner"/>
  <rect x="306" y="560" width="206" height="48" rx="12" class="inner"/>
  <rect x="534" y="560" width="220" height="48" rx="12" class="inner"/>
  <rect x="776" y="560" width="340" height="48" rx="12" class="inner"/>
  <text x="98" y="590" class="body">Verify signature</text>
  <text x="326" y="590" class="body">Hash payload bytes</text>
  <text x="554" y="590" class="body">Device · rollback checks</text>
  <text x="796" y="590" class="body">Transactional install · secure boot</text>
</svg>
