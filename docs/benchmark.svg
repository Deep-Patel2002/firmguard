<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="500" viewBox="0 0 1120 500" role="img" aria-labelledby="title desc">
  <title id="title">FirmGuard measured parser throughput</title>
  <desc id="desc">Median warm in-memory throughput, three repeats of 50,000 parses. One-image manifest: C 3.56 million parses per second, Rust 3.15 million. Sixty-four-image manifest: C 90.7 thousand, Rust 101.1 thousand. Local x86-64 WSL2 measurement, not a service-level objective.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#10192d"/><stop offset="1" stop-color="#182a45"/></linearGradient>
    <linearGradient id="cbar" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#0891b2"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
    <linearGradient id="rbar" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#4f46e5"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
    <style>
      .title{font:700 28px Arial,sans-serif;fill:#f8fafc}.sub{font:14px Arial,sans-serif;fill:#a9bad2}
      .group{font:700 18px Arial,sans-serif;fill:#f8fafc}.label{font:14px Arial,sans-serif;fill:#c6d3e5}
      .value{font:700 14px Arial,sans-serif;fill:#f8fafc}.small{font:12px Arial,sans-serif;fill:#9fb0c9}
    </style>
  </defs>
  <rect width="1120" height="500" rx="26" fill="url(#bg)"/>
  <circle cx="1040" cy="28" r="145" fill="#8b5cf6" opacity=".08"/>
  <text x="46" y="56" class="title">Measured parser throughput</text>
  <text x="46" y="82" class="sub">Median warm in-memory parses per second · 50,000 iterations × 3 repeats</text>
  <rect x="48" y="112" width="488" height="294" rx="18" fill="#192943" stroke="#314867"/>
  <rect x="560" y="112" width="512" height="294" rx="18" fill="#192943" stroke="#314867"/>
  <text x="74" y="148" class="group">172 bytes · 1 image</text>
  <text x="586" y="148" class="group">7,480 bytes · 64 images</text>
  <text x="74" y="194" class="label">C11</text>
  <rect x="145" y="175" width="330" height="27" rx="8" fill="url(#cbar)"/>
  <text x="145" y="222" class="value">3,556,668 /s</text>
  <text x="74" y="274" class="label">Rust</text>
  <rect x="145" y="255" width="292" height="27" rx="8" fill="url(#rbar)"/>
  <text x="145" y="302" class="value">3,150,576 /s</text>
  <text x="74" y="365" class="small">Within-panel bar scale · synthetic manifest</text>

  <text x="586" y="194" class="label">C11</text>
  <rect x="657" y="175" width="250" height="27" rx="8" fill="url(#cbar)"/>
  <text x="657" y="222" class="value">90,709 /s</text>
  <text x="586" y="274" class="label">Rust</text>
  <rect x="657" y="255" width="279" height="27" rx="8" fill="url(#rbar)"/>
  <text x="657" y="302" class="value">101,127 /s</text>
  <text x="586" y="365" class="small">Within-panel bar scale · synthetic manifest</text>

  <rect x="49" y="429" width="12" height="12" rx="3" fill="url(#cbar)"/>
  <text x="69" y="440" class="small">C11</text>
  <rect x="124" y="429" width="12" height="12" rx="3" fill="url(#rbar)"/>
  <text x="144" y="440" class="small">Rust</text>
  <text x="218" y="440" class="small">x86_64 WSL2 · GCC 13.3 · Rust 1.75 · no payload I/O or verification</text>
</svg>
