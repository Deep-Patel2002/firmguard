name: verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install the locked project toolchain
        run: rustup toolchain install 1.75.0 --profile minimal --component rustfmt
      - name: Check formatting
        run: cargo fmt --manifest-path rust/Cargo.toml --all -- --check
      - name: Test safe parser and FFI bridge
        run: cargo test --manifest-path rust/Cargo.toml --locked
  c-parser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build and test C library
        run: |
          cmake -S . -B build/cmake -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          cmake --build build/cmake --parallel 2
          ctest --test-dir build/cmake --output-on-failure
      - name: Sanitizers, differential corpus, and coverage-guided fuzzing
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clang
          make test sanitize differential fuzz
      - name: Record benchmark evidence
        run: make bench
      - name: Upload verification evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: firmguard-verification-linux
          path: docs/verification/latest-*.json
          if-no-files-found: error
